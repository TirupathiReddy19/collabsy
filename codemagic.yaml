workflows:
  ios-workflow:
    name: Collabsy iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      # The distribution certificate itself is now uploaded to Codemagic's
      # own "Code signing identities" store (had to be generated manually
      # via a CSR + this API key, since --create-ing a brand new
      # certificate through fetch-signing-files hit a codemagic-cli-tools
      # limitation: "Cannot save Signing Certificates without certificate
      # private key"). With a real certificate already on file, this
      # shorthand only needs to create the provisioning profile, which
      # doesn't hit that problem.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: online.collabsy.app
      vars:
        APP_STORE_APPLE_ID: 6808197823
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
      cancel_previous_builds: true
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            -t lib/main.dart \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip on once you're ready to go beyond internal TestFlight testers:
        # submit_to_app_store: true
