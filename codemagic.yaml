workflows:
  ios-workflow:
    name: Collabsy iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "online.collabsy.app"
        APP_STORE_APPLE_ID: 6808197823
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
      cancel_previous_builds: true
    scripts:
      # The certificate itself already exists on Apple's servers (created
      # manually via a CSR after --create-ing one here hit "Cannot save
      # Signing Certificates without certificate private key"), so
      # fetch-signing-files finds it through the API - but it still has no
      # matching private key unless we hand it one explicitly.
      # CERTIFICATE_PRIVATE_KEY is a secure environment variable (Settings
      # -> Environment variables) holding that certificate's PEM private
      # key; Codemagic's own "Code signing identities" store isn't read by
      # this raw CLI command, only by the ios_signing shorthand, which
      # doesn't create missing profiles - hence going the explicit route.
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create \
            --delete-stale-profiles
      # errSecInternalComponent while re-signing vendored frameworks (grpc,
      # absl, etc.) is a known symptom of keychain ACL/partition-list quirks
      # on the shared macOS login keychain on fresh CI instances. A
      # dedicated keychain that codemagic-cli-tools fully owns end-to-end
      # (creates, unlocks, sets the codesign partition list on) is the more
      # reliable path here than reusing the login keychain.
      - name: Set up a dedicated signing keychain
        script: keychain initialize
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      # Bypassing `flutter build ipa` for the archive step: its JSON diagnostics
      # collapse a codesign failure down to "Command CodeSign failed with a
      # nonzero exit code" with zero detail. Flutter's own embedded Xcode Run
      # Script build phase still does everything `flutter build ios` would
      # (flutter assemble, etc.), so a direct xcodebuild call works the same,
      # just with the real, unfiltered output - piped to a log file via `tee`
      # so it survives even if the build fails (also enable pipefail so a
      # failing xcodebuild still fails the script instead of `tee`'s exit
      # code masking it).
      - name: Xcode archive
        script: |
          set -e -o pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            2>&1 | tee /tmp/xcodebuild_archive.log
      - name: Xcode export ipa
        script: |
          set -e -o pipefail
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist \
            2>&1 | tee /tmp/xcodebuild_export.log
      # Automatic dSYM upload, so future builds never need the manual
      # drag-and-drop into Crashlytics again. FirebaseCrashlytics ships a
      # CLI tool for exactly this (normally wired as an Xcode build phase,
      # which this project never had - see the "Zip dSYMs" fallback step
      # below). Not using `set -e` here deliberately: if the exact flags
      # ever drift with a Firebase SDK update, this should warn, not take
      # down the whole release - the zip artifact below is the fallback.
      - name: Upload dSYMs to Crashlytics automatically
        script: |
          ios/Pods/FirebaseCrashlytics/run \
            -gsp ios/Runner/GoogleService-Info.plist \
            -p ios \
            build/ios/archive/Runner.xcarchive/dSYMs \
            || echo "Automatic dSYM upload failed - fall back to the Runner-dSYMs.zip artifact"
      # Kept as a manual fallback in case the automatic step above ever
      # breaks - drag this into the Crashlytics dSYMs tab.
      - name: Zip dSYMs for Crashlytics
        script: |
          set -e -o pipefail
          cd build/ios/archive/Runner.xcarchive/dSYMs
          zip -r /tmp/Runner-dSYMs.zip .
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_export.log
      - /tmp/xcodebuild_logs/*.log
      - /tmp/Runner-dSYMs.zip
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip on once you're ready to go beyond internal TestFlight testers:
        # submit_to_app_store: true
