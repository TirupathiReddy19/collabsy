workflows:
  ios-workflow:
    name: Collabsy iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      vars:
        BUNDLE_ID: "online.collabsy.app"
        APP_STORE_APPLE_ID: 6808197823
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
      cancel_previous_builds: true
    scripts:
      # The ios_signing shorthand only *finds* existing certs/profiles, it
      # doesn't create a missing profile - hence the earlier "No matching
      # profiles found" failure even with a real certificate on file. The
      # certificate itself is now uploaded to Codemagic's Code signing
      # identities store (generated manually via CSR, since --create-ing a
      # brand new one here previously hit "Cannot save Signing
      # Certificates without certificate private key"), so this should now
      # find that certificate and only need to create the profile.
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Use system default keychain
        script: keychain use-login
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            -t lib/main.dart \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip on once you're ready to go beyond internal TestFlight testers:
        # submit_to_app_store: true
