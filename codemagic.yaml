workflows:
  ios-workflow:
    name: Collabsy iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      vars:
        BUNDLE_ID: "online.collabsy.app"
        APP_STORE_APPLE_ID: 6808197823
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
      cancel_previous_builds: true
    scripts:
      # No distribution certificate or provisioning profile exists yet in
      # the Apple Developer account (fresh account) - `--create` tells the
      # App Store Connect API to generate them itself, using the
      # Admin-scoped API key. This is the one step that would otherwise
      # require a Mac's Keychain Access to do locally.
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Use system default keychain
        script: keychain use-login
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            -t lib/main.dart \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip on once you're ready to go beyond internal TestFlight testers:
        # submit_to_app_store: true
