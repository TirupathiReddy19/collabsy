<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- No static <title>/<meta name="description">/og:type here on purpose:
         every route renders its own via <Seo> (src/components/Seo.tsx),
         defaulting to og:type "website" and overriding to "article" on blog
         posts. React's title/meta hoisting adds tags, it doesn't remove ones
         already in this file, so a static fallback here would leave two of
         each in the live DOM on every page, permanently - which is exactly
         what happened when og:type still had one here: crawlers read the
         first og:type tag in the DOM, so blog posts kept reporting
         "website". -->
    <meta
      name="keywords"
      content="influencer marketing, influencer marketing agency, D2C influencer marketing, creator marketing, UGC, influencer campaigns India, micro-influencers"
    />

    <!-- Open Graph / Twitter fields that don't vary by page; title/description/url/type come from each page's <Seo> -->
    <meta property="og:site_name" content="Collabsy" />
    <meta property="og:image" content="https://collabsy.online/collabsy-icon.png" />
    <!-- collabsy-icon.png is a square 1024x1024 app icon, not the wide
         (1.91:1) image summary_large_image expects - "summary" is the
         correct card type for a square image. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://collabsy.online/collabsy-icon.png" />

    <link rel="icon" type="image/png" href="/collabsy-icon.png" />
    <link rel="apple-touch-icon" href="/collabsy-icon.png" />
    <meta name="theme-color" content="#F97316" />

    <!-- Structured data: only facts already published elsewhere on the site
         (Contact page / footer) — no invented ratings, reviews, or social
         profiles that don't exist. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://collabsy.online/#organization",
            "name": "Collabsy",
            "url": "https://collabsy.online/",
            "logo": "https://collabsy.online/collabsy-icon.png",
            "description": "Collabsy connects D2C brands with verified micro-influencers across India for campaigns that convert — discover, apply, chat, and collaborate, or let our team run it end to end.",
            "sameAs": [
              "https://apps.apple.com/in/app/collabsy/id6808197823",
              "https://play.google.com/store/apps/details?id=online.collabsy.app"
            ],
            "email": "hello@collabsy.online",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Bangalore",
              "addressCountry": "IN"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer service",
              "email": "hello@collabsy.online",
              "telephone": "+91-93814-87811",
              "areaServed": "IN"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://collabsy.online/#website",
            "url": "https://collabsy.online/",
            "name": "Collabsy",
            "description": "Collabsy connects D2C brands with verified micro-influencers across India for campaigns that convert.",
            "publisher": { "@id": "https://collabsy.online/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
